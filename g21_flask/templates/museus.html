{% extends "layout.html" %}

{% block title %}Museus{% endblock %}

{% block content %}
    <h1>🏛️ Museum Directory</h1>
    
    <div class="tabela-container">
        <table>
            <tr>
                <th>ID</th>
                <th>Museum Name</th>
            </tr>
            {% for m in museus %}
            <tr>
                <td>{{ m.id }}</td>
                <td><strong>{{ m.name }}</strong></td>
            </tr>
            {% endfor %}
        </table>
    </div>
{% endblock %}
